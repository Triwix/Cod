name: Cod
options:
  bundleIdPrefix: com.josh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "36"
    DEVELOPMENT_TEAM: UE492DNA6V
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    COD_PRIVACY_POLICY_URL: ""
    COD_DISPLAY_NAME: Cod
    COD_SHARE_LAUNCH_POLICY: manual-open
  configs:
    Debug:
      COD_DISPLAY_NAME: Cod Test

targets:
  Cod:
    type: application
    platform: iOS
    sources:
      - path: Cod
        excludes:
          - Resources/Shortcuts
      - path: Cod/Resources/Shortcuts
        type: folder
        buildPhase: resources
      # The Safari extension's Float button script, reused in the web video screen.
      - path: CodSafari/Resources/content.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.cod.store
        PRODUCT_NAME: Cod
        INFOPLIST_FILE: Cod/Info.plist
        CODE_SIGN_ENTITLEMENTS: Cod/StoreRelease.entitlements
        COD_URL_SCHEME: cod-store
        COD_APP_GROUP: group.com.josh.cod.store
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: targeted
    dependencies:
      - target: CodShare
        embed: true
      - target: CodControls
        embed: true
      - target: CodSafari
        embed: true

  CodControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CodControls
      - path: Cod/Intents/FloatControlIntent.swift
      - path: Cod/Intents/SavedReferenceIntent.swift
      - path: Cod/Support/SavedReferenceCatalog.swift
      - path: Cod/FloatingTools/CodTimerAlarmMetadata.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.cod.store.controls
        PRODUCT_NAME: CodControls
        INFOPLIST_FILE: CodControls/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: CodControls/CodControls.entitlements
        COD_APP_GROUP: group.com.josh.cod.store
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) COD_CONTROLS_EXTENSION"
        SWIFT_STRICT_CONCURRENCY: targeted
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  CodShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CodShare
      # Shared with the app. Without an App Group the extension can't reach the
      # app's history, but it can still run the same crop surface and OCR.
      - path: Cod/Models
      - path: Cod/Recognition
      - path: Cod/Support
      - path: Cod/Views/Selection
      - path: Cod/Views/Components/ActionBar.swift
      - path: Cod/Store/AppSettings.swift
      - path: Cod/Capture/ImageProcessing.swift
      - path: Cod/FloatingTools/FloatingText.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.cod.store.share
        PRODUCT_NAME: CodShare
        INFOPLIST_FILE: CodShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: Cod/StoreRelease.entitlements
        COD_APP_GROUP: group.com.josh.cod.store
        COD_URL_SCHEME: cod-store
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: targeted
        SKIP_INSTALL: YES

  CodSafari:
    type: app-extension
    platform: iOS
    sources:
      - path: CodSafari
        excludes:
          - Resources
      # Safari reads manifest.json and its files from the extension's root.
      - path: CodSafari/Resources/manifest.json
        buildPhase: resources
      - path: CodSafari/Resources/content.js
        buildPhase: resources
      - path: CodSafari/Resources/popup.html
        buildPhase: resources
      - path: CodSafari/Resources/popup.css
        buildPhase: resources
      - path: CodSafari/Resources/popup.js
        buildPhase: resources
      - path: CodSafari/Resources/_locales
        type: folder
        buildPhase: resources
      - path: CodSafari/Resources/images
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.cod.store.safari
        PRODUCT_NAME: CodSafari
        INFOPLIST_FILE: CodSafari/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  CodTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CodTests
        excludes:
          - Fixtures
      # Local App Store products for StoreKit tests; never shipped in the app.
      - path: StoreKit/CodPro.storekit
        buildPhase: resources
      - path: CodTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Cod
      - sdk: StoreKitTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.cod.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: targeted

  CodLaunchHarness:
    type: application
    platform: iOS
    sources:
      - path: CodLaunchHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.cod.launch-harness
        INFOPLIST_FILE: CodLaunchHarness/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cod Launch Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: Cod
        embed: false

  CodLaunchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CodLaunchUITests
    dependencies:
      - target: CodLaunchHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.cod.launch-ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CodLaunchHarness

schemes:
  Cod Launch Tests:
    build:
      targets:
        Cod: all
        CodLaunchHarness: all
    test:
      config: Debug
      targets:
        - name: CodLaunchUITests
  Cod:
    build:
      targets:
        Cod: all
    run:
      config: Debug
      # Local products so the Pro screen works in Debug runs before App
      # Store Connect has them. Release and TestFlight use the real store.
      storeKitConfiguration: StoreKit/CodPro.storekit
    test:
      config: Debug
      gatherCoverageData: true
      storeKitConfiguration: StoreKit/CodPro.storekit
      targets:
        - name: CodTests
    archive:
      config: Release
