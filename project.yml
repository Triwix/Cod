name: Cod
options:
  bundleIdPrefix: com.josh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: UE492DNA6V
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Cod:
    type: application
    platform: iOS
    sources:
      - path: Cod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.cod
        PRODUCT_NAME: Cod
        INFOPLIST_FILE: Cod/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - target: CodShare
        embed: true

  CodShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CodShare
      # Shared with the app. Without an App Group the extension can't reach the
      # app's history, but it can still run the same crop surface and OCR.
      - path: Cod/Models
      - path: Cod/Recognition
      - path: Cod/Support
      - path: Cod/Views/Selection
      - path: Cod/Views/Components
      - path: Cod/Store/AppSettings.swift
      - path: Cod/Capture/ImageProcessing.swift
      - path: Cod/Capture/PhotoLibraryService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.cod.share
        PRODUCT_NAME: CodShare
        INFOPLIST_FILE: CodShare/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        SKIP_INSTALL: YES

  CodTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CodTests
    dependencies:
      - target: Cod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.cod.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  Cod:
    build:
      targets:
        Cod: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: CodTests
