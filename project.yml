name: Cod
options:
  bundleIdPrefix: com.josh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "7"
    DEVELOPMENT_TEAM: UE492DNA6V
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    COD_PRIVACY_POLICY_URL: ""
    COD_DISPLAY_NAME: Cod
    COD_SHARE_LAUNCH_POLICY: manual-open
  configs:
    Debug:
      COD_DISPLAY_NAME: Cod Test

targets:
  Cod:
    type: application
    platform: iOS
    sources:
      - path: Cod
        excludes:
          - Resources/Shortcuts
      - path: Cod/Resources/Shortcuts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.cod.store
        PRODUCT_NAME: Cod
        INFOPLIST_FILE: Cod/Info.plist
        CODE_SIGN_ENTITLEMENTS: Cod/StoreRelease.entitlements
        COD_URL_SCHEME: cod-store
        COD_APP_GROUP: group.com.josh.cod.store
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - target: CodShare
        embed: true
      - target: CodControls
        embed: true

  CodControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CodControls
      - path: Cod/Intents/FloatControlIntent.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.cod.store.controls
        PRODUCT_NAME: CodControls
        INFOPLIST_FILE: CodControls/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) COD_CONTROLS_EXTENSION"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  CodShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CodShare
      # Shared with the app. Without an App Group the extension can't reach the
      # app's history, but it can still run the same crop surface and OCR.
      - path: Cod/Models
      - path: Cod/Recognition
      - path: Cod/Support
      - path: Cod/Views/Selection
      - path: Cod/Views/Components/ActionBar.swift
      - path: Cod/Store/AppSettings.swift
      - path: Cod/Capture/ImageProcessing.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.cod.store.share
        PRODUCT_NAME: CodShare
        INFOPLIST_FILE: CodShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: Cod/StoreRelease.entitlements
        COD_APP_GROUP: group.com.josh.cod.store
        COD_URL_SCHEME: cod-store
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        SKIP_INSTALL: YES

  CodTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CodTests
    dependencies:
      - target: Cod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.cod.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: minimal

  CodLaunchHarness:
    type: application
    platform: iOS
    sources:
      - path: CodLaunchHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.cod.launch-harness
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cod Launch Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: Cod
        embed: false

  CodLaunchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CodLaunchUITests
    dependencies:
      - target: CodLaunchHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josh.cod.launch-ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CodLaunchHarness

schemes:
  Cod Launch Tests:
    build:
      targets:
        Cod: all
        CodLaunchHarness: all
    test:
      config: Debug
      targets:
        - name: CodLaunchUITests
  Cod:
    build:
      targets:
        Cod: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: CodTests
    archive:
      config: Release
